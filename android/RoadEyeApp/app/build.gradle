plugins {
    id 'com.android.application'
}

android {
    namespace 'com.roadeye.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.roadeye.app"

        minSdk 26
        targetSdk 36

        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}
